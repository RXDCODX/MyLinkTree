name: Update Twitch Avatar & Nickname

on:
  schedule:
    - cron: "0 0 */7 * *"
  push:
    branches: [main]
    paths: [links.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-twitch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Yarn
        run: |
          corepack enable
          yarn --version

      - name: Read login from links.json
        id: config
        run: echo "login=$(jq -er '.twitch.login' links.json)" >> "$GITHUB_OUTPUT"

      # Аватар и ник берём из og:image / og:title страницы канала на twitch.tv.
      # Это тот же публичный HTML, который используют Discord и Telegram для
      # превью ссылок, поэтому никаких client_id / client_secret не нужно.
      - name: Fetch Twitch profile
        id: twitch
        run: |
          PAGE=$(curl -fsSL --retry 3 "https://www.twitch.tv/${{ steps.config.outputs.login }}")
          AVATAR=$(printf '%s' "$PAGE" \
            | grep -o 'og:image" content="[^"]*"' \
            | head -n 1 \
            | sed -E 's/^og:image" content="(.*)"$/\1/')
          TITLE=$(printf '%s' "$PAGE" \
            | grep -o 'og:title" content="[^"]*"' \
            | head -n 1 \
            | sed -E 's/^og:title" content="(.*)"$/\1/')

          if [ -z "$AVATAR" ]; then
            echo "::error::Канал ${{ steps.config.outputs.login }} не найден или у него нет аватарки"
            exit 1
          fi

          DISPLAY_NAME=$(printf '%s' "$TITLE" | sed -E 's/[[:space:]]*-[[:space:]]*Twitch$//')
          {
            echo "display_name=${DISPLAY_NAME:-${{ steps.config.outputs.login }}}"
            echo "avatar_url=$AVATAR"
          } >> "$GITHUB_OUTPUT"

          echo "display_name=$DISPLAY_NAME"
          echo "avatar_url=$AVATAR"

      - name: Update links.json
        if: github.event_name != 'push'
        run: |
          jq \
            --arg login "${{ steps.config.outputs.login }}" \
            --arg displayName "${{ steps.twitch.outputs.display_name }}" \
            --arg avatarUrl "${{ steps.twitch.outputs.avatar_url }}" \
            '.twitch.login = $login
             | .twitch.displayName = $displayName
             | .twitch.avatarUrl = $avatarUrl' \
            links.json > links.json.tmp
          mv links.json.tmp links.json

      - name: Commit and Push Changes
        if: github.event_name != 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Twitch avatar and nickname"
          file_pattern: links.json

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist